<body class="bg-[#F5F5F5] text-[#2C3E50] font-sans">

  <!-- LAYOUT UTAMA LAPTOP: SIDEBAR KIRI (#2C3E50) & AREA PEMANGGIL FITUR DI KANAN -->
  <div class="min-h-screen flex flex-col lg:flex-row">

    <!-- ================= 1. SIDEBAR KIRI (MENU UTAMA) ================= -->

      <div>

        <nav class="space-y-1" id="sidebarNav">
          <button type="button" id="nav-dashboard" data-feature="dashboard" onclick="panggilFitur('dashboard.html', 'Fitur 6: Dashboard Analitik', 'I Putu Gede Agastya Krisna Widartha', this)" class="menu-btn w-full text-left px-4 py-2.5 rounded-xl text-xs font-bold bg-white text-[#2C3E50] flex items-center gap-2.5 cursor-pointer">

            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4 shrink-0">

            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4 shrink-0">
              <path stroke-linecap="round" stroke-linejoin="round" d="M7.5 8.25h9m-9 3H12m-9.75 1.51c0 1.6 1.123 2.994 2.707 3.227 1.129.166 2.27.293 3.423.379.35.026.67.21.865.501L12 21l2.755-4.133a1.14 1.14 0 0 1 .865-.501 48.172 48.172 0 0 0 3.423-.379c1.584-.233 2.707-1.626 2.707-3.228V6.741c0-1.602-1.123-2.995-2.707-3.228A48.394 48.394 0 0 0 12 3c-2.392 0-4.744.175-7.043.513C3.373 3.746 2.25 5.14 2.25 6.741v6.018Z" />
            </svg>

          <button type="button" id="nav-autentikasi" data-feature="autentikasi" onclick="panggilFitur('autentikasi.html', 'Fitur 4: Autentikasi & Verifikasi Toko', 'William Peter Vanx Najoan', this)" class="menu-btn w-full text-left px-4 py-2.5 rounded-xl text-xs font-medium text-gray-300 hover:bg-white/10 flex items-center gap-2.5 cursor-pointer">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4 shrink-0">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75m-3-7.036A11.959 11.959 0 0 1 3.598 6 11.99 11.99 0 0 0 3 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285Z" />

            <p class="text-xs font-bold">Bantuan Warung</p>

    <!-- ================= 2. AREA KANAN (HEADER & PEMANGGIL FILE FITUR) ================= -->

            <input type="text" placeholder="Cari barang, faktur, pembeli..." class="pl-9 pr-4 py-1.5 bg-[#F5F5F5] border border-gray-300 rounded-full text-xs w-60 focus:outline-none focus:border-[#2C3E50]" />

            </svg>
            <span>29 Okt 2026</span>
          </span>
          <span class="p-2 bg-[#F5F5F5] rounded-lg border border-gray-300 text-[#2C3E50] inline-flex items-center justify-center">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
              <path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 0 0 5.454-1.31A8.967 8.967 0 0 1 18 9.75V9A6 6 0 0 0 6 9v.75a8.967 8.967 0 0 1-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 0 1-5.714 0m5.714 0a3 3 0 1 1-5.714 0" />

          <span class="w-8 h-8 rounded-full bg-[#2C3E50] text-white flex items-center justify-center">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
            </svg>
          </span>
        </div>
      </header>

      <!-- Wadah Pemanggil File HTML dari PIC Lain -->
      <main class="flex-1 flex flex-col">
        <iframe id="frameFitur" class="w-full flex-1 border-0 min-h-[88vh]"></iframe>
      </main>

  <!-- ================= 3. SCRIPT PEMANGGIL & PENGATUR ROLE ================= -->
  <script>
    // Konfigurasi hak akses (authorization mapping) per role:
    // - konsumen: hanya mencari barang (showcase), mereservasi & membayar (reservasi), serta memberi ulasan/voting stok (ulasan)
    // - merchant: mengelola dasbor warung, stok inventaris, memproses antrean reservasi di kasir, melihat ulasan, & mengajukan profil toko
    // - admin: memverifikasi toko baru & memantau seluruh modul sistem
    const rolePermissions = {
      merchant: ['dashboard', 'inventaris', 'reservasi', 'ulasan', 'autentikasi'],
      konsumen: ['showcase', 'reservasi', 'ulasan'],
      admin: ['dashboard', 'inventaris', 'showcase', 'reservasi', 'ulasan', 'autentikasi']
    };

    const roleDefaultPage = {
      merchant: { id: 'nav-dashboard', file: 'dashboard.html', title: 'Fitur 6: Dashboard Analitik', pic: 'I Putu Gede Agastya Krisna Widartha' },
      konsumen: { id: 'nav-showcase', file: 'showcase.html', title: 'Fitur 2: Showcase & Radius', pic: 'Rayfito Krisna Wijaya' },
      admin:    { id: 'nav-autentikasi', file: 'autentikasi.html', title: 'Fitur 4: Autentikasi & Verifikasi Toko', pic: 'William Peter Vanx Najoan' }
    };

    let currentRole = 'merchant';
    let activeFeatureFile = 'dashboard.html';
    let activeFeatureName = 'Fitur 6: Dashboard Analitik';
    let activePicName = 'I Putu Gede Agastya Krisna Widartha';
    let activeBtnElement = null;

    const btnInactiveClass = "menu-btn w-full text-left px-4 py-2.5 rounded-xl text-xs font-medium text-gray-300 hover:bg-white/10 flex items-center gap-2.5 cursor-pointer";
    const btnActiveClass = "menu-btn w-full text-left px-4 py-2.5 rounded-xl text-xs font-bold bg-white text-[#2C3E50] flex items-center gap-2.5 cursor-pointer";

    function kirimRoleKeIframe() {
      try {
        localStorage.setItem('warlok_role', currentRole);
      } catch (e) {}
      const frame = document.getElementById('frameFitur');
      if (frame && frame.contentWindow) {
        frame.contentWindow.postMessage({ tipe: 'GANTI_ROLE', role: currentRole }, '*');
      }
    }

    function panggilFitur(namaFile, judulFitur, namaPic, tombolAktif) {
      const featureKey = tombolAktif ? tombolAktif.getAttribute('data-feature') : null;

      // Cek apakah role saat ini diizinkan membuka fitur ini
      if (featureKey && !rolePermissions[currentRole].includes(featureKey)) {
        showAccessDeniedNotice(judulFitur);
        return;
      }

      activeFeatureFile = namaFile;
      activeFeatureName = judulFitur;
      activePicName = namaPic;
      activeBtnElement = tombolAktif;

      const frame = document.getElementById('frameFitur');

      // Ubah warna tombol menu sidebar yang sedang aktif
      document.querySelectorAll('.menu-btn').forEach(function(btn) {
        if (!btn.classList.contains('hidden')) {
          btn.className = btnInactiveClass;
        }
      });
      if (tombolAktif) {
        tombolAktif.className = btnActiveClass;
      }

      try {
        localStorage.setItem('warlok_role', currentRole);
      } catch (e) {}

      // Jika dibuka di browser laptop (file dalam 1 folder), panggil file HTML-nya:
      if (window.self === window.top) {
        frame.removeAttribute('srcdoc');
        frame.onload = function() {
          kirimRoleKeIframe();
        };
        frame.src = namaFile;
      } else {
        frame.srcdoc = `
          <html>
            <head><script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"><\/script></head>
            <body class="bg-[#F5F5F5] text-[#2C3E50] font-sans p-6">
              <div class="bg-white p-6 rounded-xl border border-gray-200 space-y-2 shadow-sm">
                <span class="bg-[#E74C3C] text-white text-xs font-bold px-2.5 py-1 rounded">PEMANGGIL FILE FITUR AKTIF</span>
                <h2 class="text-2xl font-bold">${judulFitur}</h2>
                <p class="text-sm text-gray-600">Memanggil file: <code class="font-bold text-[#E74C3C]">${namaFile}</code> (PIC: <b>${namaPic}</b>)</p>
                <p class="text-xs text-gray-500">Akses disesuaikan untuk role: <span class="uppercase font-bold text-slate-800">${currentRole}</span>.</p>
              </div>
            </body>
          </html>`;
      }
    }

    function showAccessDeniedNotice(namaFitur) {
      const frame = document.getElementById('frameFitur');
      frame.removeAttribute('src');
      frame.srcdoc = `
        <html>
          <head><script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"><\/script></head>
          <body class="bg-[#F5F5F5] text-[#2C3E50] font-sans p-6 flex items-center justify-center min-h-[80vh]">
            <div class="bg-white p-8 rounded-2xl border border-red-200 text-center max-w-md shadow-lg space-y-4">
              <div class="w-16 h-16 bg-red-100 text-[#E74C3C] rounded-full flex items-center justify-center mx-auto">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-8 h-8">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z" />
                </svg>
              </div>
              <h3 class="text-xl font-bold text-[#2C3E50]">Akses Dibatasi</h3>
              <p class="text-xs text-gray-600 leading-relaxed">Peran <span class="uppercase font-bold text-[#E74C3C]">${currentRole}</span> tidak memiliki hak akses untuk membuka menu <strong class="text-slate-800">${namaFitur}</strong>.</p>
              <button onclick="window.parent.resetToDefaultDashboard()" class="mt-2 px-4 py-2 bg-[#2C3E50] text-white text-xs font-bold rounded-xl cursor-pointer hover:bg-slate-700">Kembali ke Halaman Utama Peran</button>
            </div>
          </body>
        </html>`;
    }

    function resetToDefaultDashboard() {
      const def = roleDefaultPage[currentRole] || roleDefaultPage.merchant;
      const targetBtn = document.getElementById(def.id);
      panggilFitur(def.file, def.title, def.pic, targetBtn);
    }

    function gantiRole(kodeRole, labelSidebar, teksSapaan, tombolRole) {
      currentRole = kodeRole;
      document.getElementById('labelRoleSidebar').textContent = labelSidebar;
      document.getElementById('sapaanHeader').textContent = teksSapaan;

      document.querySelectorAll('.role-btn').forEach(function(b) {
        b.className = "role-btn py-1 rounded text-gray-300 hover:bg-slate-700 cursor-pointer";
      });
      tombolRole.className = "role-btn py-1 rounded bg-[#E74C3C] text-white font-bold cursor-pointer";

      // Perbarui visibilitas menu di sidebar berdasarkan role
      updateSidebarMenuVisibility();

      // Cek apakah halaman aktif saat ini diizinkan untuk role baru ini
      const allowedFeatures = rolePermissions[kodeRole];
      const currentActiveFeature = activeBtnElement ? activeBtnElement.getAttribute('data-feature') : 'dashboard';

      if (!allowedFeatures.includes(currentActiveFeature)) {
        resetToDefaultDashboard();
      } else {
        kirimRoleKeIframe();
      }
    }

    function updateSidebarMenuVisibility() {
      const allowed = rolePermissions[currentRole];
      document.querySelectorAll('#sidebarNav .menu-btn').forEach(function(btn) {
        const feature = btn.getAttribute('data-feature');
        btn.classList.toggle('hidden', !allowed.includes(feature));
      });
    }

    // Sinkronkan highlight menu sidebar jika ada tombol di dalam iframe yang pindah halaman
    window.addEventListener('message', function(event) {
      if (event.data && event.data.tipe === 'PINDAH_MENU') {
        const targetBtn = document.getElementById('nav-' + event.data.fitur);
        if (targetBtn && !targetBtn.classList.contains('hidden')) {
          document.querySelectorAll('.menu-btn').forEach(function(btn) {
            if (!btn.classList.contains('hidden')) {
              btn.className = btnInactiveClass;
            }
          });
          targetBtn.className = btnActiveClass;
          activeBtnElement = targetBtn;
        }
      }
    });

    window.onload = function() {
      updateSidebarMenuVisibility();
      resetToDefaultDashboard();
    };
  </script>
</body>
</html>
